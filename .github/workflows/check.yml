name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-track:
    name: ${{ github.event_name == 'pull_request' && 'train-track' || format('train-track-{0}', github.event_name) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check semantic coverage and pen motion
        run: sh checks/check-train-track.sh
